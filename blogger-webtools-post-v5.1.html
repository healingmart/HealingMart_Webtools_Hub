  function setupSlider(track, previous, next, interval) {
    var timer = 0;
    var resumeTimer = 0;

    function amount() {
      var first = track.firstElementChild;
      if (!first) return Math.max(240, track.clientWidth * 0.8);
      var style = window.getComputedStyle(track);
      var gap = parseFloat(style.columnGap || style.gap || "12") || 12;
      return first.getBoundingClientRect().width + gap;
    }

    function move(direction) {
      var max = track.scrollWidth - track.clientWidth - 4;

      if (direction > 0 && track.scrollLeft >= max) {
        track.scrollTo({ left: 0, behavior: "smooth" });
      } else if (direction < 0 && track.scrollLeft <= 4) {
        track.scrollTo({ left: track.scrollWidth, behavior: "smooth" });
      } else {
        track.scrollBy({ left: direction * amount(), behavior: "smooth" });
      }
    }

    function stop() {
      window.clearInterval(timer);
      timer = 0;
    }

    function start() {
      stop();
      if (track.children.length < 2) return;
      timer = window.setInterval(function () {
        move(1);
      }, Math.max(2500, Number(interval) || 3800));
    }

    function resumeLater() {
      stop();
      window.clearTimeout(resumeTimer);
      resumeTimer = window.setTimeout(start, Math.max(2500, Number(interval) || 3800));
    }

    previous.addEventListener("click", function () {
      move(-1);
      resumeLater();
    });

    next.addEventListener("click", function () {
      move(1);
      resumeLater();
    });

    track.addEventListener("pointerdown", stop);
    track.addEventListener("pointerup", resumeLater);
    track.addEventListener("pointercancel", resumeLater);
    track.addEventListener("mouseenter", stop);
    track.addEventListener("mouseleave", start);
    track.addEventListener("focusin", stop);
    track.addEventListener("focusout", start);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) stop();

    start();

    var headParts = createSectionHead("새로 나온 도구", "최근 등록·업데이트된 웹도구입니다.", "h2");
    var actions = element("div", "hm-wt-slider-actions");
    var previous = element("button", "hm-wt-slider-btn");
    var next = element("button", "hm-wt-slider-btn");

    previous.type = "button";
    next.type = "button";
    previous.setAttribute("aria-label", "이전 신규 도구");
    next.setAttribute("aria-label", "다음 신규 도구");
    previous.appendChild(icon("arrowLeft"));
    next.appendChild(icon("arrowRight"));
    actions.append(previous, next);
    headParts.head.appendChild(actions);

    var track = element("div", "hm-wt-latest");
    var latest = tools
      .slice()
      .sort(function (a, b) {
        return (Date.parse(b.updatedAt) || 0) - (Date.parse(a.updatedAt) || 0);
      })
      .slice(0, Math.max(1, Number(data.settings.latestLimit) || 12));

    latest.forEach(function (tool) {
      var category = map.get(tool.category);
      var card = element("article", "hm-wt-latest-card");
      applyTone(card, category);
      card.tabIndex = 0;
      card.setAttribute("role", "button");

      var top = element("div", "hm-wt-latest-top");
      top.appendChild(element("span", "hm-wt-new", "NEW"));

      var iconWrap = element("div", "hm-wt-latest-icon");
      iconWrap.appendChild(icon(tool.icon || (category && category.icon)));
      top.appendChild(iconWrap);

      card.append(
        top,
        element("strong", "", tool.name),
        element("p", "", tool.description)
      );

      card.addEventListener("click", function () {
        openTool(tool, data);
      });

      card.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openTool(tool, data);
        }
      });

      track.appendChild(card);
    });

    section.append(headParts.head, track);
    setupSlider(track, previous, next, data.settings.autoplayInterval);
    return section;
  }

  function createCategoriesSection(data, map, state, refresh) {
    var section = element("section", "hm-wt-section");
    section.dataset.hmWebtoolsCategories = "true";

    var head = createSectionHead("카테고리", "필요한 분야만 선택해 도구를 확인하세요.", "h2");
    var grid = element("div", "hm-wt-categories");

    data.categories
      .slice()
      .sort(function (a, b) {
        return (Number(a.order) || 0) - (Number(b.order) || 0);
      })
      .forEach(function (category) {
        var button = element("button", "hm-wt-category");
        button.type = "button";
        applyTone(button, category);

        if (state.category === category.id) {
          button.classList.add("is-active");
        }

        var iconWrap = element("div", "hm-wt-category-icon");
        iconWrap.appendChild(icon(category.icon));

        var copy = element("div");
        copy.append(
          element("strong", "", category.name),
          element("span", "", category.description)
        );

        button.append(iconWrap, copy);
        button.addEventListener("click", function () {
          state.category = state.category === category.id ? "all" : category.id;
          refresh();
          window.setTimeout(function () {
            var result = section.parentElement.querySelector("[data-hm-webtools-results]");
            if (result) result.scrollIntoView({ behavior: "smooth", block: "start" });
          }, 0);
        });

        grid.appendChild(button);
      });

    section.append(head.head, grid);
    return { section: section, grid: grid };
  }

  function filterTools(tools, map, state) {
    var query = normalize(state.query);

    return tools.filter(function (tool) {
      if (state.category !== "all" && tool.category !== state.category) {
        return false;
      }

      if (!query) return true;

      var category = map.get(tool.category);
      var searchable = [
        tool.name,
        tool.shortName,
        tool.description,
        category ? category.name : "",
        Array.isArray(tool.keywords) ? tool.keywords.join(" ") : ""
      ].join(" ");

      return normalize(searchable).includes(query);
    });
  }

  function createSheet(data, tools, map, type) {
    if (sheetState) {
      sheetState.close();
    }

    var overlay = element("div", "hm-wt-sheet");
    var panel = element("section", "hm-wt-sheet-panel");
    var head = element("header", "hm-wt-sheet-head");
    var copy = element("div");
    var close = element("button", "hm-wt-sheet-close");
    var body = element("div", "hm-wt-sheet-body");
    var grid = element("div", "hm-wt-grid");

    overlay.hidden = true;
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-modal", "true");

    close.type = "button";
    close.setAttribute("aria-label", "닫기");
    close.appendChild(icon("close"));

    var title = type === "recent" ? "최근 사용한 도구" : "웹도구 빠른찾기";
    var description = type === "recent"
      ? "이 브라우저에서 최근 열었던 도구입니다."
      : "도구 이름이나 기능을 검색하세요.";

    copy.append(
      element("h2", "", title),
      element("p", "", description)
    );
    head.append(copy, close);

    var searchControl = null;
    var currentTools = tools;

    if (type === "recent") {
      var ids = recentIds();
      currentTools = ids.map(function (id) {
        return tools.find(function (tool) {
          return tool.id === id;
        });
      }).filter(Boolean);

      buildGrid(grid, currentTools, map, data, "아직 최근 사용한 도구가 없습니다.");
      body.appendChild(grid);
    } else {
      searchControl = createSearch(function (query) {
        var normalized = normalize(query);
        var filtered = normalized
          ? tools.filter(function (tool) {
              var category = map.get(tool.category);
              var searchable = [
                tool.name,
                tool.shortName,
                tool.description,
                category ? category.name : "",
                Array.isArray(tool.keywords) ? tool.keywords.join(" ") : ""
              ].join(" ");
              return normalize(searchable).includes(normalized);
            })
          : tools;

        buildGrid(grid, filtered, map, data);
      }, data.settings.searchPlaceholder);

      body.append(searchControl.wrap, grid);
      buildGrid(grid, currentTools, map, data);
    }

    panel.append(head, body);
    overlay.appendChild(panel);
    document.body.appendChild(overlay);

    var previousOverflow = "";

    function open() {
      previousOverflow = document.body.style.overflow;
      document.body.style.overflow = "hidden";
      overlay.hidden = false;
      if (searchControl) {
        window.setTimeout(function () {
          searchControl.input.focus();
        }, 80);
      }
    }

    function closeSheet() {
      overlay.hidden = true;
      document.body.style.overflow = previousOverflow;
      overlay.remove();
      sheetState = null;
    }

    close.addEventListener("click", closeSheet);
    overlay.addEventListener("click", function (event) {
      if (event.target === overlay) closeSheet();
    });

    function onKey(event) {
      if (event.key === "Escape") {
        document.removeEventListener("keydown", onKey);
        closeSheet();
      }
    }

    document.addEventListener("keydown", onKey);

    sheetState = { open: open, close: closeSheet };
    open();
  }

  function createBottomNav(root, data, tools, map) {
    var nav = element("nav", "hm-wt-bottom-nav");
    nav.setAttribute("aria-label", "웹도구 빠른 메뉴");

    function button(label, iconName, action) {
      var control = element("button");
      control.type = "button";
      control.append(icon(iconName), element("span", "", label));
      control.addEventListener("click", action);
      return control;
    }

    nav.append(
      button("빠른찾기", "search", function () {
        createSheet(data, tools, map, "search");
      }),
      button("최근사용", "recent", function () {
        createSheet(data, tools, map, "recent");
      }),
      button("신규도구", "spark", function () {
        var target = root.querySelector("[data-hm-webtools-latest]");
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      }),
      button("카테고리", "categories", function () {
        var target = root.querySelector("[data-hm-webtools-categories]");
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      })
    );

    document.body.appendChild(nav);

    var boundary = element("span", "hm-wt-boundary");
    boundary.setAttribute("aria-hidden", "true");
    root.insertAdjacentElement("afterend", boundary);

    if ("IntersectionObserver" in window) {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          nav.classList.toggle("is-hidden", entry.isIntersecting);
        });
      }, { root: null, threshold: 0 });

      observer.observe(boundary);
    }

    return nav;
  }

  function mountHub(root, data) {
    var tools = orderedTools(data);
    var map = categoryMap(data);
    var state = { query: "", category: "all" };

    root.classList.add("hm-wt-app");
    root.replaceChildren();

    var hero = element("section", "hm-wt-hero");
    var eyebrow = element("div", "hm-wt-eyebrow");
    eyebrow.append(icon("spark"), element("span", "", "HEALINGMART WEBTOOLS"));

    hero.append(
      eyebrow,
      element("h1", "", data.site.title),
      element("p", "", data.site.description)
    );

    var search = createSearch(function (query) {
      state.query = query;
      refresh();
    }, data.settings.searchPlaceholder);

    var stats = element("div", "hm-wt-stats");
    var totalCollections = tools.reduce(function (sum, tool) {
      return sum + (Number(tool.collectionCount) || 0);
    }, 0);

    stats.append(
      element("span", "hm-wt-stat", data.categories.length + "개 분야"),
      element("span", "hm-wt-stat", tools.length + "개 대표 도구"),
      element("span", "hm-wt-stat", totalCollections.toLocaleString("ko-KR") + "개 세부 기능")
    );

    hero.append(search.wrap, stats);
    root.appendChild(hero);

    var latest = createLatestSection(data, tools, map);
    root.appendChild(latest);

    var categories = createCategoriesSection(data, map, state, refresh);
    root.appendChild(categories.section);

    var results = element("section", "hm-wt-section");
    results.dataset.hmWebtoolsResults = "true";

    var resultBar = element("div", "hm-wt-result-bar");
    var resultTitle = element("h2", "", "전체 웹도구");
    var count = element("span", "hm-wt-count");
    resultBar.append(resultTitle, count);

    var grid = element("div", "hm-wt-grid");
    results.append(resultBar, grid);
    root.appendChild(results);

    function refresh() {
      var filtered = filterTools(tools, map, state);

      if (state.query) {
        resultTitle.textContent = "검색 결과";
      } else if (state.category !== "all") {
        var category = map.get(state.category);
        resultTitle.textContent = category ? category.name + " 도구" : "웹도구";
      } else {
        resultTitle.textContent = "전체 웹도구";
      }

      count.textContent = filtered.length.toLocaleString("ko-KR") + "개";
      buildGrid(grid, filtered, map, data);

      categories.grid.querySelectorAll(".hm-wt-category").forEach(function (button, index) {
        var category = data.categories[index];
        button.classList.toggle("is-active", Boolean(category && category.id === state.category));
      });
    }

    refresh();

    if (root.dataset.bottomNav === "true") {
      createBottomNav(root, data, tools, map);
    }

    root.dataset.hmWebtoolsMounted = "true";
    root.dataset.hmWebtoolsDataSource = window.HM_WEBTOOLS_DATA_SOURCE || "embedded";
  }

  function mountCategory(root, data) {
    var categoryId = String(root.dataset.category || "").trim();
    var limit = Math.max(1, Number(root.dataset.limit) || 8);
    var columns = Math.min(4, Math.max(1, Number(root.dataset.columns) || 4));
    var tools = orderedTools(data).filter(function (tool) {
      return tool.category === categoryId;
    }).slice(0, limit);
    var map = categoryMap(data);
    var category = map.get(categoryId);
    var title = root.dataset.title || (category ? category.name + " 도구" : "추천 웹도구");
    var description = root.dataset.description || (category ? category.description : "함께 사용하면 좋은 웹도구입니다.");

    root.classList.add("hm-wt-app", "hm-wt-category-view");
    root.style.setProperty("--hm-columns", String(columns));
    root.replaceChildren();

    var section = element("section", "hm-wt-section");
    var head = createSectionHead(title, description, "h3");
    var grid = element("div", "hm-wt-grid");

    section.append(head.head, grid);
    root.appendChild(section);
    buildGrid(grid, tools, map, data, "이 분류에 등록된 도구가 없습니다.");
    root.dataset.hmWebtoolsMounted = "true";
    root.dataset.hmWebtoolsDataSource = window.HM_WEBTOOLS_DATA_SOURCE || "embedded";
  }

  function showLoadError(root, message) {
    root.replaceChildren();
    var box = element("div");
    box.style.cssText = "max-width:760px;min-height:220px;margin:24px auto;padding:28px 18px;display:grid;place-items:center;border:1px solid #fecaca;border-radius:18px;color:#7f1d1d;background:#fff7f7;text-align:center;";
    var copy = element("div");
    var strong = element("strong", "", "웹도구를 불러오지 못했습니다.");
    strong.style.cssText = "display:block;margin-bottom:8px;font-size:20px;";
    var text = element("span", "", message);
    text.style.cssText = "font-size:13px;line-height:1.7;";
    copy.append(strong, text);
    box.appendChild(copy);
    root.appendChild(box);
  }

  function mountRoot(root, data) {
    if (mountedRoots.has(root) || root.dataset.hmWebtoolsMounted === "true") return;
    mountedRoots.add(root);

    var view = String(root.dataset.view || "hub").toLowerCase();

    try {
      if (view === "category") {
        mountCategory(root, data);
      } else {
        mountHub(root, data);
      }
    } catch (error) {
      console.error("[HealingMart Webtools]", error);
      showLoadError(root, "브라우저 콘솔에서 오류 내용을 확인해 주세요.");
    }
  }

  function mountAll() {
    injectStyles();

    var data = window.HM_WEBTOOLS_DATA;
    var roots = document.querySelectorAll(ROOT_SELECTOR);

    if (!roots.length) return;

    if (!data || !Array.isArray(data.tools) || !Array.isArray(data.categories)) {
      roots.forEach(function (root) {
        showLoadError(root, "hm-webtools-data.js가 먼저 로드되었는지 확인해 주세요.");
      });
      return;
    }

    roots.forEach(function (root) {
      mountRoot(root, data);
    });
  }

  window.HMWebTools = Object.freeze({
    version: VERSION,
    mountAll: mountAll,
    openSearch: function () {
      var data = window.HM_WEBTOOLS_DATA;
      if (!data) return;
      createSheet(data, orderedTools(data), categoryMap(data), "search");
    }
  });

  function start() {
    mountAll();
    document.dispatchEvent(new CustomEvent("hm:webtools:ready", {
      detail: { version: VERSION }
    }));
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start, { once: true });
  } else {
    start();
  }

  document.addEventListener("hm:webtools:data-ready", mountAll);
})(window, document);

};

</script>

<script>
//<![CDATA[
(function(window,document){
  "use strict";

  var DATA_URL="https://cdn.jsdelivr.net/gh/healingmart/healingmart-webtools-hub@main/data/hm-webtools-data.js";
  var settled=false;

  function boot(source){
    if(settled)return;
    settled=true;
    window.HM_WEBTOOLS_DATA_SOURCE=source;

    if(typeof window.HMWebToolsBootV5==="function"){
      window.HMWebToolsBootV5();
    }
  }

  var script=document.createElement("script");
  script.src=DATA_URL;
  script.async=true;

  script.onload=function(){
    if(window.HM_WEBTOOLS_DATA){
      boot("data-js");
    }else{
      window.HM_WEBTOOLS_DATA=window.HM_WEBTOOLS_FALLBACK_DATA;
      boot("embedded");
    }
  };

  script.onerror=function(){
    window.HM_WEBTOOLS_DATA=window.HM_WEBTOOLS_FALLBACK_DATA;
    boot("embedded");
  };

  document.head.appendChild(script);

  window.setTimeout(function(){
    if(settled)return;
    window.HM_WEBTOOLS_DATA=window.HM_WEBTOOLS_FALLBACK_DATA;
    boot("embedded");
  },900);
})(window,document);
//]]>
</script>
